<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Clicker Master</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#000;color:#fff;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:auto;padding-bottom:90px}
h1{
  font-size:28px;
  display:flex;align-items:center;gap:8px;
  margin:12px 0;
  font-weight:950;
  letter-spacing:.8px;
  font-style:italic;
  text-shadow:0 2px 0 #444,0 0 10px rgba(255,255,255,.35);
}
.urlrow{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:12px;border-radius:12px;border:1px solid #444;background:#18181b;color:#fff;font-size:16px}
button{border:2px solid rgba(255,255,255,.72);border-radius:14px;font-weight:800;color:white;touch-action:manipulation;transition:filter .06s,box-shadow .06s,transform .06s}
.score-flash{filter:brightness(2.15)!important;box-shadow:0 0 0 3px #fff,0 0 24px rgba(255,255,255,.95)!important;transform:scale(.97)}
.load{padding:0 16px;background:#3b82f6}
.filebtn{border:2px solid rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;padding:0 14px;background:#52525b;border-radius:14px;font-weight:800;white-space:nowrap;cursor:pointer}
.filebtn input{display:none}
.local-video{width:100%;height:100%;background:#000;object-fit:contain}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
.search-results{display:none;background:#18181b;border-radius:14px;padding:10px;margin-bottom:10px;max-height:42vh;overflow:auto}
.search-results.show{display:block}
.result{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:8px 0;border-bottom:1px solid #333;cursor:pointer}
.result:last-child{border-bottom:0}.result img{width:120px;aspect-ratio:16/9;object-fit:cover;border-radius:8px}.result-title{font-size:14px;font-weight:700;line-height:1.3}.api-note{font-size:12px;color:#aaa;margin:4px 0 0}
@media(max-width:520px){.result{grid-template-columns:100px 1fr}.result img{width:100px}}
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#18181b;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
.scorebox{margin:0;display:block}.scorebox .stat{height:48px;display:flex;align-items:center;justify-content:center;gap:8px;padding:6px 12px}.scorebox .stat b{display:inline;font-size:24px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{height:82px;font-size:25px}
.plus{background:#16a34a}.minus{background:#dc2626}.miss{background:#ea580c}.special{background:#7c3aed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}.actions .scorebox{width:100%}.reset-row{display:flex;justify-content:center;margin-top:10px}.reset-row button{width:50%;max-width:360px;height:48px;background:#27272a;font-size:16px}
.actions button{height:48px;background:#27272a;font-size:16px}
h2{font-size:18px;margin:18px 0 8px}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}
.panel{width:100%;background:#18181b;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.panel h3{text-align:center;margin-top:0}
.penalties{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.penalties button{height:60px;background:#7c3aed;font-size:20px}
.cancel{width:100%;height:48px;margin-top:10px;background:#3f3f46}
.small{color:#aaa;font-size:12px;margin:8px 2px}
.special-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.special-row .big{font-size:18px;height:72px}
.controller-box{background:#18181b;border-radius:14px;padding:12px;margin-top:12px;text-align:center}
.controller-map{font-size:13px;color:#aaa;margin-top:5px}


/* 横向き表示 */
@media (orientation:landscape) and (max-height:600px){
  body{padding:env(safe-area-inset-top) max(10px,env(safe-area-inset-right)) env(safe-area-inset-bottom) max(10px,env(safe-area-inset-left))}
  .wrap{max-width:none;display:grid;grid-template-columns:minmax(320px,1.15fr) minmax(360px,.85fr);grid-template-areas:
    "title title"
    "search search"
    "video scores"
    "video normal"
    "video special"
    "video reset"
    "video specialTitle"
    "video specialStats";gap:8px 12px;align-items:start}
  h1{grid-area:title;font-size:22px;margin:4px 0}
  .urlrow{grid-area:search;margin:0}
  .search-results{grid-column:1/-1;max-height:45vh;margin:0}
  .video{grid-area:video;align-self:start}
  .scorebox{position:static;width:auto;margin:0;display:block}
  .grid{grid-area:normal}
  .special-row{grid-area:special;margin:0}
  .actions{grid-area:reset;margin:0}
  .reset-row{grid-column:2;justify-content:center;margin-top:0}
  .csv-save{grid-column:2;width:50%;margin:0 auto}
  .small{display:none}
  h2:nth-of-type(1){grid-area:specialTitle;margin:4px 0 0}
  h2:nth-of-type(1)+.scorebox{grid-area:specialStats}
  .big{height:58px;font-size:22px}
  .special-row .big{height:56px;font-size:15px}
  .actions button{height:42px}
  .stat{padding:6px}
  .stat b{font-size:21px}
}


.csv-save{
  display:block;
  width:50%;
  max-width:360px;
  height:48px;
  margin:10px auto 0;
  background:#2563eb;
  font-size:16px;
}

button,.filebtn,.scorebtn,.special-btn,.reset-row,.actions{
  -webkit-user-select:none;
  user-select:none;
  -webkit-touch-callout:none;
}
button,.filebtn{touch-action:manipulation;}


.scoring-slider{overflow:hidden;touch-action:pan-y;margin-top:0}
.scoring-track{display:flex;width:200%;transform:translateX(0);transition:transform .22s ease}
.scoring-page{width:50%;flex:0 0 50%;padding:0 1px}
.scoring-slider.show-fe .scoring-track{transform:translateX(-50%)}
.fe-head{display:flex;align-items:center;justify-content:space-between;margin:2px 0 8px}
.fe-head b{font-size:18px}
.fe-hint{font-size:12px;color:#aaa}
.fe-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fe-item{background:#18181b;border-radius:14px;padding:8px}
.fe-name{font-size:13px;font-weight:900;margin-bottom:6px;text-align:center}
.fe-controls{display:grid;grid-template-columns:42px 1fr 42px;gap:5px;align-items:center}
.fe-controls button{height:40px;background:#3f3f46;font-size:22px}
.fe-value{text-align:center;font-size:23px;font-weight:900}
.fe-total{margin-top:8px;background:#18181b;border-radius:14px;height:48px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:800}
.fe-total b{font-size:24px}


.fe-picker{width:100%;height:46px;background:#27272a;display:flex;align-items:center;justify-content:center;gap:12px}
.fe-arrow{font-size:24px;color:#aaa}
.fe-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.68);z-index:9999;align-items:center;justify-content:center;padding:18px}
.fe-modal.open{display:flex}
.fe-dialog{width:min(92vw,420px);background:#18181b;border:1px solid #555;border-radius:18px;padding:16px}
.fe-dialog-title{text-align:center;font-weight:900;font-size:18px;margin-bottom:12px}
.fe-slider-value{text-align:center;font-size:34px;font-weight:950;margin:4px 0 8px}
.fe-slider{width:100%;height:40px}
.fe-scale{display:flex;justify-content:space-between;font-size:10px;color:#aaa}
.fe-modal-actions{display:flex;gap:8px;margin-top:14px}
.fe-modal-actions button{flex:1;height:44px}


.compact-fe{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}
.fe-compact{background:#18181b;border-radius:9px;padding:4px 7px}
.fe-label{display:grid;grid-template-columns:38px 1fr 24px;align-items:center;gap:3px;line-height:1}
.fe-label b{font-size:12px}
.fe-label span{font-size:8px;color:#aaa;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fe-label strong{font-size:14px;text-align:right}
.fe-range{width:100%;height:20px;margin:0}
.compact-total{height:30px;margin-top:5px;font-size:12px}
.compact-total b{font-size:17px}
@media (max-width:600px){
  .compact-fe{gap:4px}
  .fe-compact{padding:3px 6px}
}


.fe-summary-row{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px;margin-bottom:4px}
.fe-summary-row .scorebox{margin:0}
.fe-summary-row .stat{font-size:13px;text-align:center}
.fe-summary-row .stat b{font-size:20px}


.bottom-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.bottom-actions button{width:100%;height:48px;margin:0}
.bottom-actions .csv-save{max-width:none}

.title-clickers{width:72px;height:42px;object-fit:contain;flex:0 0 auto}

<script>
let events = JSON.parse(localStorage.getItem("yoyo-events")||"[]");
let started = Number(localStorage.getItem("yoyo-started")) || Date.now();

function save(){localStorage.setItem("yoyo-events",JSON.stringify(events));localStorage.setItem("yoyo-started",started);render()}
function timeText(){
  let s=Math.floor((Date.now()-started)/1000), m=Math.floor(s/60);
  return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function flashButton(id){
 const b=document.getElementById(id); if(!b)return;
 b.classList.remove("score-flash"); void b.offsetWidth; b.classList.add("score-flash");
 setTimeout(()=>b.classList.remove("score-flash"),110);
}
function addEvent(label,value,buttonId){events.push({label,value,miss:false,time:timeText()});save();flashButton(buttonId || (value>0?"plusBtn":"minusBtn"));navigator.vibrate?.(20)}
function addMiss(){events.push({label:"MISS",value:0,miss:true,time:timeText()});save();navigator.vibrate?.(35)}
function specialNamed(name,v,buttonId){events.push({label:name+" "+v,value:v,special:name,time:timeText()});save();flashButton(buttonId || ({"停止":"stopBtn","放棄":"changeBtn","切断":"cutBtn"}[name]));navigator.vibrate?.(35)}
function undo(){events.pop();save()}
function resetAll(){if(confirm("採点をすべてリセットしますか？")){events=[];feScores=Object.fromEntries(FE_CODES.map(k=>[k,0]));saveFE();started=Date.now();feScores=Object.fromEntries(FE_CODES.map(k=>[k,0]));saveFE();save()}}
function openSpecial(){document.getElementById("sheet").style.display="flex"}
function closeSpecial(){document.getElementById("sheet").style.display="none"}


const FE_CODES=["EXE","CTR","TRV","SUE","CHG","CNS","BDY","SHW"];
let feScores=JSON.parse(localStorage.getItem("yoyo-fe-scores")||"null") || Object.fromEntries(FE_CODES.map(k=>[k,0]));
function saveFE(){localStorage.setItem("yoyo-fe-scores",JSON.stringify(feScores));renderFE()}
function setFEInline(code,value){
  feScores[code]=Number(value);
  saveFE();
}
function renderFE(){
  FE_CODES.forEach(code=>{
    const v=Number(feScores[code])||0;
    const el=document.getElementById("fe_"+code); if(el)el.textContent=v;
    const range=document.querySelector('.fe-range[data-fe="'+code+'"]'); if(range)range.value=v;
  });
  const raw=FE_CODES.reduce((a,k)=>a+(Number(feScores[k])||0),0);
  const el=document.getElementById("feTotal"); if(el)el.textContent=(raw/2).toFixed(1);
}

function csvCell(value){
  const text=String(value ?? "");
  return '"' + text.replace(/"/g,'""') + '"';
}
function saveCsv(){
  const plus=events.filter(e=>!e.special && e.value>0).reduce((a,e)=>a+e.value,0);
  const minus=Math.abs(events.filter(e=>!e.special && e.value<0).reduce((a,e)=>a+e.value,0));
  const stop=events.filter(e=>e.special==="停止").length;
  const change=events.filter(e=>e.special==="放棄").length;
  const cut=events.filter(e=>e.special==="切断").length;
  const title=currentVideoTitle || "動画タイトル未設定";
  const rows=[
    ["動画タイトル","加点","減点","停止","放棄","切断","EXE","CTR","TRV","SUE","CHG","CNS","BDY","SHW","FE合計"],
    [title,plus,minus,stop,change,cut,...FE_CODES.map(k=>Number(feScores[k])||0),FE_CODES.reduce((a,k)=>a+(Number(feScores[k])||0),0)/2]
  ];
  const csv="\uFEFF"+rows.map(row=>row.map(csvCell).join(",")).join("\r\n");
  const blob=new Blob([csv],{type:"text/csv;charset=utf-8"});
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url;
  a.download="ClickerMaster_点数表_"+new Date().toISOString().slice(0,10)+".csv";
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
}

function render(){
 let plus=events.filter(e=>!e.special && e.value>0).reduce((a,e)=>a+e.value,0);
 let minus=Math.abs(events.filter(e=>!e.special && e.value<0).reduce((a,e)=>a+e.value,0));
 document.getElementById("totalScore").textContent=plus-minus;
 let specialTotal=events.filter(e=>e.special).reduce((a,e)=>a+e.value,0);
 document.getElementById("specialTotal").textContent=specialTotal;
 document.getElementById("plusScore").textContent=plus;
 document.getElementById("minusScore").textContent=minus;
 document.getElementById("stopStat").textContent=events.filter(e=>e.special==="停止").length+"回";
 document.getElementById("changeStat").textContent=events.filter(e=>e.special==="放棄").length+"回";
 document.getElementById("cutStat").textContent=events.filter(e=>e.special==="切断").length+"回";
 renderFE();
}
let currentVideoTitle = "";
let localVideoObjectUrl = null;
function playLocalVideo(input){
  const file=input && input.files && input.files[0];
  if(!file) return;

  currentVideoTitle=file.name;

  if(localVideoObjectUrl){
    URL.revokeObjectURL(localVideoObjectUrl);
  }
  localVideoObjectUrl=URL.createObjectURL(file);

  const box=document.getElementById("video");
  if(!box) return;

  const v=document.createElement("video");
  v.className="local-video";
  v.controls=true;
  v.playsInline=true;
  v.setAttribute("playsinline","");
  v.setAttribute("webkit-playsinline","");
  v.preload="auto";
  v.src=localVideoObjectUrl;

  /* Replace only the contents of the existing video window. */
  box.replaceChildren(v);

  const results=document.getElementById("searchResults");
  if(results) results.className="search-results";

  v.load();
  v.play().catch(()=>{});
}

function getYoutubeApiKey(){
  let key=localStorage.getItem("yt-api-key")||"";
  if(!key){
    key=prompt("初回のみ：YouTube Data APIキーを入力してください")||"";
    key=key.trim();
    if(key) localStorage.setItem("yt-api-key",key);
  }
  return key;
}
async function searchVideo(){
  const q=document.getElementById("searchQ").value.trim();
  if(!q){alert("検索する言葉を入力してください");return}
  const key=getYoutubeApiKey();
  if(!key) return;
  const box=document.getElementById("searchResults");
  box.className="search-results show";
  box.innerHTML="検索中…";
  try{

function undoBySign(sign){
  for(let i=events.length-1;i>=0;i--){
    const e=events[i];
    // Only cancel normal +/- scoring, not special penalties.
    if(!e.special && ((sign>0 && e.value>0) || (sign<0 && e.value<0))){
      events.splice(i,1);
      save();
      navigator.vibrate?.(25);
      return;
    }
  }
}


function performReset(){
  events = [];
  feScores = Object.fromEntries(FE_CODES.map(k => [k, 0]));
  saveFE();
  save();
  navigator.vibrate?.(50);
}

// Smartphone: reset only after holding the reset button for 1 second.
let resetHoldTimer = null;
const resetHoldBtn = document.getElementById("resetHoldBtn");
if(resetHoldBtn){
  const startResetHold = (ev) => {
    ev.preventDefault();
    clearTimeout(resetHoldTimer);
    resetHoldTimer = setTimeout(() => {
      performReset();
      resetHoldTimer = null;
    }, 1000);
  };
  const cancelResetHold = () => {
    if(resetHoldTimer){
      clearTimeout(resetHoldTimer);
      resetHoldTimer = null;
    }
  };
  resetHoldBtn.addEventListener("pointerdown", startResetHold);
  resetHoldBtn.addEventListener("pointerup", cancelResetHold);
  resetHoldBtn.addEventListener("pointercancel", cancelResetHold);
  resetHoldBtn.addEventListener("pointerleave", cancelResetHold);
  resetHoldBtn.addEventListener("contextmenu", e => e.preventDefault());
}

// Bluetooth / Gamepad controller
// Standard Gamepad mapping assumed:
// A=0, B=1, X=2, L/LB=4, R/RB=5.
// Edge detection prevents holding a button from repeatedly scoring.
let previousButtons = [];
let lrHoldStart = null;
let lrResetFired = false;

window.addEventListener("gamepadconnected", e => {
  document.getElementById("controllerStatus") && (document.getElementById("controllerStatus").textContent =
    "🎮 接続済み: " + e.gamepad.id);
});
window.addEventListener("gamepaddisconnected", e => {
  document.getElementById("controllerStatus") && (document.getElementById("controllerStatus").textContent =
    "🎮 コントローラー未接続");
  previousButtons = [];
});

function pollGamepad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = Array.from(pads).find(Boolean);
  if(gp){
    document.getElementById("controllerStatus") && (document.getElementById("controllerStatus").textContent =
      "🎮 接続済み: " + gp.id);
    const now = gp.buttons.map(b => b.pressed);
    
    const pressed = i => now[i] && !previousButtons[i];

    // L + R simultaneous hold for 1 second = reset.
    if(now[4] && now[5]){
      if(lrHoldStart === null) lrHoldStart = performance.now();
      if(!lrResetFired && performance.now() - lrHoldStart >= 1000){
        performReset();
        lrResetFired = true;
      }
    } else {
      lrHoldStart = null;
      lrResetFired = false;
    }

    if(pressed(4) && !now[5]) addEvent("+1",1);        // L: immediate
    if(pressed(5) && !now[4]) addEvent("-1",-1);       // R: immediate
    if(pressed(6)) undoBySign(1);                     // ZL: last normal + undo
    if(pressed(7)) undoBySign(-1);                    // ZR: last normal - undo
    if(pressed(2)) specialNamed("停止", -1);          // X
    if(pressed(0)) specialNamed("放棄", -3);          // A
    if(pressed(1)) specialNamed("切断", -5);          // B

    previousButtons = now;
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

document.getElementById("searchQ")?.addEventListener("keydown", e => {
  if(e.key === "Enter") searchVideo();
});

render();

(function(){
let idx=0,tm=0,tc=0,ts=0; const D=.55,R=180,S=5;
function ranges(){return Array.from(document.querySelectorAll('.fe-range')).slice(0,8)}
function hi(a){a.forEach((e,i)=>{let b=e.closest('.fe-compact')||e.parentElement;if(b)b.style.outline=i===idx?'2px solid #ffd54a':''})}
function val(e,d){if(!e)return;e.value=Math.max(0,Math.min(10,(+e.value||0)+d));e.dispatchEvent(new Event('input',{bubbles:true}));e.dispatchEvent(new Event('change',{bubbles:true}))}
function seek(d){let v=document.querySelector('video');if(v&&isFinite(v.duration)){v.currentTime=Math.max(0,Math.min(v.duration,v.currentTime+d));return}try{if(window.player&&player.getCurrentTime)player.seekTo(Math.max(0,player.getCurrentTime()+d),true)}catch(e){}}
function loop(t){let g=navigator.getGamepads&&Array.from(navigator.getGamepads()).find(Boolean),a=ranges();if(g&&a.length){let lx=g.axes[0]||0,rx=g.axes[2]||0,ry=g.axes[3]||0;if(Math.abs(ry)>D&&t-tm>R){idx=(idx+(ry>0?1:-1)+a.length)%a.length;tm=t;hi(a)}if(Math.abs(rx)>D&&t-tc>R){val(a[idx],rx>0?1:-1);tc=t;hi(a)}if(Math.abs(lx)>D&&t-ts>220){seek(lx>0?S:-S);ts=t}}requestAnimationFrame(loop)}
addEventListener('gamepadconnected',()=>hi(ranges()));requestAnimationFrame(loop);
})();

<script>
(function(){
 const KEY='cmScoreOrder'; let held=null,timer=null,sx=0,sy=0;
 function get(){let g=document.querySelector('.grid');if(!g)return null;let a=Array.from(g.children).filter(e=>e.classList.contains('big')).slice(0,2);return a.length===2?[g,a]:null}
 function type(e){let t=e.textContent||'';return /[+＋]/.test(t)?'plus':'minus'}
 function save(){let x=get();if(x)localStorage.setItem(KEY,x[1].map(type).join(','))}
 function swap(a,b){let p=a.parentNode,m=document.createTextNode('');p.insertBefore(m,a);p.insertBefore(a,b);p.insertBefore(b,m);m.remove();save()}
 function setup(){let x=get();if(!x)return;let [g,a]=x,o=localStorage.getItem(KEY);if(o){let w=o.split(','),m={};a.forEach(e=>m[type(e)]=e);if(w.length===2&&m[w[0]]&&type(a[0])!==w[0])swap(a[0],a[1]);x=get();a=x[1]}
 a.forEach(el=>{el.draggable=true;
  el.addEventListener('dragstart',e=>{held=el;el.classList.add('score-dragging');e.dataTransfer.effectAllowed='move'});
  el.addEventListener('dragover',e=>{e.preventDefault();if(el!==held)el.classList.add('score-drop-target')});
  el.addEventListener('dragleave',()=>el.classList.remove('score-drop-target'));
  el.addEventListener('drop',e=>{e.preventDefault();if(held&&held!==el)swap(held,el)});
  el.addEventListener('dragend',()=>{a.forEach(b=>b.classList.remove('score-dragging','score-drop-target'));held=null});
  el.addEventListener('touchstart',e=>{let t=e.touches[0];sx=t.clientX;sy=t.clientY;timer=setTimeout(()=>{held=el;el.classList.add('score-dragging')},450)},{passive:true});
  el.addEventListener('touchmove',e=>{let t=e.touches[0];if(!held&&Math.hypot(t.clientX-sx,t.clientY-sy)>12){clearTimeout(timer);return}if(held){e.preventDefault();a.forEach(b=>b.classList.remove('score-drop-target'));let q=document.elementFromPoint(t.clientX,t.clientY),b=a.find(z=>z===q||z.contains(q));if(b&&b!==held)b.classList.add('score-drop-target')}},{passive:false});
  el.addEventListener('touchend',e=>{clearTimeout(timer);if(held){let t=e.changedTouches[0],q=document.elementFromPoint(t.clientX,t.clientY),b=a.find(z=>z===q||z.contains(q));if(b&&b!==held)swap(held,b);a.forEach(z=>z.classList.remove('score-dragging','score-drop-target'));held=null}})
 })}

<script>
(function(){
 const SCOPE='https://www.googleapis.com/auth/youtube.readonly';
 const SAVED_KEY='clickerMasterFixedSubscriptionsV1';
 let tokenClient=null, accessToken='';

 function panel(){
   let p=document.getElementById('subsPanel');
   if(p) return p;
   p=document.createElement('div'); p.id='subsPanel';
   p.innerHTML='<div id="subsTop"><button id="subsClose">閉じる</button><b id="subsTitle">登録チャンネル</b></div><div id="subsList"></div>';
   document.body.appendChild(p);
   p.querySelector('#subsClose').onclick=()=>p.classList.remove('open');
   return p;
 }

 function getClientId(){
   let id=localStorage.getItem('ytOAuthClientId');
   if(!id){
     id=prompt('Google OAuth 2.0 クライアントIDを入力してください');
     if(id) localStorage.setItem('ytOAuthClientId',id.trim());
   }
   return id&&id.trim();
 }

 function readSaved(){
   try{
     const x=JSON.parse(localStorage.getItem(SAVED_KEY)||'null');
     return x && Array.isArray(x.channels) ? x : null;
   }catch(e){ return null; }
 }
 function writeSaved(channels){
   localStorage.setItem(SAVED_KEY,JSON.stringify({
     channels:channels,
     savedAt:Date.now()
   }));
   localStorage.setItem('clickerMasterSubscriptionsPermanentLockV1','1');
 }
 function clearSaved(){ localStorage.removeItem(SAVED_KEY); }

 function esc(x){
   return String(x||'').replace(/[&<>"']/g,c=>({
     '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
   }[c]));
 }

 function renderSaved(channels){
   const list=document.getElementById('subsList');
   const title=document.getElementById('subsTitle');
   title.textContent='登録チャンネル';
   list.innerHTML='';
   channels.forEach(ch=>{
     const b=document.createElement('button');
     b.className='subCard';
     b.dataset.channelId=ch.id;
     b.innerHTML=(ch.thumb?'<img src="'+esc(ch.thumb)+'">':'')+
                 '<span>'+esc(ch.title)+'</span>';
     b.onclick=()=>loadChannel(ch.id,ch.title);
     list.appendChild(b);
   });
   if(!channels.length) list.textContent='登録チャンネルがありません。';
 }

 async function keyApi(url){
   const key=localStorage.getItem('yt-api-key')||'';
   if(!key) throw new Error('API key missing');
   const r=await fetch(url+(url.includes('?')?'&':'?')+'key='+encodeURIComponent(key));
   if(!r.ok) throw new Error('YouTube API '+r.status);
   return r.json();
 }

 async function loadChannel(id,name){
   const list=document.getElementById('subsList');
   document.getElementById('subsTitle').textContent=name;
   list.textContent='動画を読み込み中…';
   try{
     const c=await keyApi('https://www.googleapis.com/youtube/v3/channels?part=contentDetails&id='+encodeURIComponent(id));
     const pl=c.items?.[0]?.contentDetails?.relatedPlaylists?.uploads;
     if(!pl) throw new Error('uploads');
     const d=await keyApi('https://www.googleapis.com/youtube/v3/playlistItems?part=snippet&maxResults=50&playlistId='+encodeURIComponent(pl));
     list.innerHTML='';
     (d.items||[]).forEach(it=>{
       const sn=it.snippet, vid=sn.resourceId?.videoId;
       if(!vid) return;
       const b=document.createElement('button');
       b.className='subCard vidCard';
       b.innerHTML=(sn.thumbnails?.medium?.url?'<img src="'+esc(sn.thumbnails.medium.url)+'">':'')+
                   '<span>'+esc(sn.title)+'</span>';
       b.onclick=()=>{
         if(typeof playVideo==='function') playVideo(vid,sn.title);
         panel().classList.remove('open');
       };
       list.appendChild(b);
     });
   }catch(e){
     list.textContent='動画を取得できませんでした。YouTube APIキーを確認してください。';
   }
 }

 function oauth(cb,chooseAccount){
   const id=getClientId(); if(!id) return;
   if(!window.google||!google.accounts||!google.accounts.oauth2){
     alert('Google認証を読み込み中です。数秒後にもう一度押してください。');
     return;
   }
   tokenClient=google.accounts.oauth2.initTokenClient({
     client_id:id,
     scope:SCOPE,
     callback:r=>{
       if(r&&r.access_token){
         accessToken=r.access_token;
         cb();
       }
     },
     error_callback:()=>{}
   });
   tokenClient.requestAccessToken({prompt:chooseAccount?'select_account':''});
 }

 async function oauthApi(url){
   const r=await fetch(url,{headers:{Authorization:'Bearer '+accessToken}});
   if(!r.ok) throw new Error('YouTube API '+r.status);
   return r.json();
 }

 async function fetchSubscriptionsForSelection(){
   const list=document.getElementById('subsList');
   const title=document.getElementById('subsTitle');
   title.textContent='この登録チャンネルを固定しますか？';
   list.textContent='登録チャンネルを確認中…';
   try{
     let items=[],page='';
     do{
       const d=await oauthApi(
         'https://www.googleapis.com/youtube/v3/subscriptions?part=snippet&mine=true&maxResults=50&order=alphabetical'+
         (page?'&pageToken='+encodeURIComponent(page):'')
       );
       items.push(...(d.items||[]));
       page=d.nextPageToken||'';
     }while(page);

     const channels=items.map(it=>({
       id:it.snippet?.resourceId?.channelId||'',
       title:it.snippet?.title||'',
       thumb:it.snippet?.thumbnails?.default?.url||''
     })).filter(x=>x.id);

     list.innerHTML='';
     const confirm=document.createElement('button');
     confirm.className='subCard';
     confirm.style.gridColumn='1/-1';
     confirm.textContent='この登録チャンネルで固定';
     confirm.onclick=()=>{
       writeSaved(channels);
       renderSaved(channels);
     };
     list.appendChild(confirm);

     channels.forEach(ch=>{
       const b=document.createElement('button');
       b.className='subCard';
       b.dataset.channelId=ch.id;
       b.innerHTML=(ch.thumb?'<img src="'+esc(ch.thumb)+'">':'')+
                   '<span>'+esc(ch.title)+'</span>';
       b.onclick=()=>{};
       list.appendChild(b);
     });
   }catch(e){
     list.textContent='登録チャンネルを取得できませんでした。';
   }
 }

 // Normal tap NEVER starts OAuth if a fixed snapshot exists.
 function openSubs(){
   panel().classList.add('open');
   const saved=readSaved();
   if(saved){
     renderSaved(saved.channels);
     return;
   }
   oauth(fetchSubscriptionsForSelection,true);
 }

 // Only explicit long press can discard the fixed snapshot.
 function switchSubsAccount(){
   if(localStorage.getItem('clickerMasterSubscriptionsPermanentLockV1')==='1'){
     openSubs();
     return;
   }
   accessToken='';
   panel().classList.add('open');
   document.getElementById('subsTitle').textContent='登録チャンネルを変更';
   document.getElementById('subsList').textContent='Googleアカウントを選択してください…';
   oauth(fetchSubscriptionsForSelection,true);
 }

 window.openSubscriptions=openSubs;
 window.switchSubscriptionsAccount=switchSubsAccount;
})();
</script>

<script id="range-touch-v45">
(function(){
  function setRangeFromPointer(el, clientX){
    const r=el.getBoundingClientRect();
    if(!r.width) return;
    let p=(clientX-r.left)/r.width;
    p=Math.max(0,Math.min(1,p));
    const min=Number(el.min||0), max=Number(el.max||100), step=Number(el.step||1);
    let v=min+p*(max-min);
    v=Math.round((v-min)/step)*step+min;
    v=Math.max(min,Math.min(max,v));
    if(Number(el.value)!==v){
      el.value=v;
      el.dispatchEvent(new Event('input',{bubbles:true}));
      el.dispatchEvent(new Event('change',{bubbles:true}));
    }
  }
  function bind(){
    document.querySelectorAll('input[type="range"]').forEach(el=>{
      if(el.dataset.touchEnhanced) return;
      el.dataset.touchEnhanced='1';
      el.addEventListener('pointerdown',e=>{
        if(e.pointerType==='touch'||e.pointerType==='pen'){
          try{el.setPointerCapture(e.pointerId)}catch(_){}
          setRangeFromPointer(el,e.clientX);
        }
      });
      el.addEventListener('pointermove',e=>{
        if((e.pointerType==='touch'||e.pointerType==='pen') && el.hasPointerCapture && el.hasPointerCapture(e.pointerId)){
          e.preventDefault();
          setRangeFromPointer(el,e.clientX);
        }
      },{passive:false});
    });
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',bind);
  else bind();
})();
</script>

<script id="v67-registration-before-file-only">
(function(){
  function place(){
    const row = document.querySelector('.urlrow');
    const reg = document.getElementById('subsLauncherV61');
    if(!row || !reg) return;

    const file = [...row.children].find(el =>
      /ファイル/.test((el.textContent || '').trim()) ||
      el.matches?.('input[type="file"]') ||
      /file/i.test(el.id || '') ||
      /file/i.test(typeof el.className === 'string' ? el.className : '')
    );
    if(!file) return;

    reg.textContent = '登録チャンネル';
    reg.style.removeProperty('display');
    reg.style.removeProperty('position');
    reg.style.removeProperty('left');
    reg.style.removeProperty('top');
    reg.style.removeProperty('right');
    reg.style.removeProperty('bottom');
    reg.style.removeProperty('transform');
    row.insertBefore(reg, file);
  }

  if(document.readyState === 'loading'){
    document.addEventListener('DOMContentLoaded', place);
  } else {
    place();
  }
  setTimeout(place, 100);
  setTimeout(place, 500);
})();

<script id="v68-smooth-fe-cursor-js">
(function(){
  function bindSmoothRange(r){
    if(r.dataset.smoothV68) return;
    r.dataset.smoothV68='1';

    function setFromX(clientX){
      const rect=r.getBoundingClientRect();
      if(!rect.width) return;
      const min=Number(r.min||0), max=Number(r.max||100);
      let p=(clientX-rect.left)/rect.width;
      p=Math.max(0,Math.min(1,p));
      const raw=min+p*(max-min);
      const step=Number(r.step||1);
      const value=Math.round((raw-min)/step)*step+min;
      r.value=Math.max(min,Math.min(max,value));
      r.dispatchEvent(new Event('input',{bubbles:true}));
      r.dispatchEvent(new Event('change',{bubbles:true}));
    }

    r.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse' && e.button!==0) return;
      try{r.setPointerCapture(e.pointerId)}catch(_){}
      setFromX(e.clientX);
      e.preventDefault();
    },{passive:false});

    r.addEventListener('pointermove',e=>{
      if(!r.hasPointerCapture?.(e.pointerId)) return;
      setFromX(e.clientX);
      e.preventDefault();
    },{passive:false});
  }

  function init(){
    document.querySelectorAll('input[type="range"]').forEach(bindSmoothRange);
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',init);
  else init();
})();
</script>

<script id="fe-scale-v11">
(function(){
 var dragging=null;
 function paint(r){
   var v=Math.max(0,Math.min(10,Number(r.value||0)));
   r.style.setProperty('--fe-fill',(v*10)+'%');
 }
 function addScales(){
   document.querySelectorAll('input[type="range"]').forEach(function(r){
     if(Number(r.min||0)!==0 || Number(r.max||10)!==10)return;
     var p=r.parentElement;if(!p)return;
     p.classList.add('fe-scale-wrap-v11');
     var old=p.querySelector('.fe-scale-v11');if(old)old.remove();
     var scale=document.createElement('div');scale.className='fe-scale-v11';
     for(var i=0;i<=10;i++){
       var x=document.createElement('span');x.textContent=String(i);scale.appendChild(x);
     }
     p.appendChild(scale);
     paint(r);

     if(!r.dataset.touchStableV15){
       r.dataset.touchStableV15='1';
       r.step='1';

       r.addEventListener('pointerdown',function(){dragging=r;});
       r.addEventListener('pointerup',function(){paint(r);dragging=null;});
       r.addEventListener('pointercancel',function(){paint(r);dragging=null;});
       r.addEventListener('touchstart',function(){dragging=r;},{passive:true});
       r.addEventListener('touchend',function(){paint(r);dragging=null;},{passive:true});

       r.addEventListener('input',function(){
         paint(r);
         /* keep the app's own input/change handlers authoritative */
       });
       r.addEventListener('change',function(){paint(r);});
     }
   });
 }
 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addScales,{once:true});
 else addScales();
 window.addEventListener('orientationchange',function(){setTimeout(addScales,150)});
})();
</script>





<script id="contest-mode-script-v20">
(function(){
 var mode='final', timer=null;
 var keep={EXE:1,CTR:1,CHG:1,BDY:1};
 var codes=['EXE','CTR','TRV','SUE','CHG','CNS','BDY','SHW'];

 function findCards(){
   var result={};
   document.querySelectorAll('*').forEach(function(el){
     if(el.children.length!==0)return;
     var code=(el.textContent||'').trim();
     if(codes.indexOf(code)<0 || result[code])return;
     var n=el.parentElement;
     for(var i=0;i<6 && n;i++,n=n.parentElement){
       var rs=n.querySelectorAll('input[type="range"][min="0"][max="10"]');
       if(rs.length===1){result[code]={card:n,range:rs[0]};break;}
     }
   });
   return result;
 }

 function calc(){
   var cards=findCards(), sum=0;
   if(mode==='prelim'){
     ['EXE','CTR','CHG','BDY'].forEach(function(c){
       if(cards[c]) sum += Number(cards[c].range.value||0);
     });
     return sum; // exactly these four only: max 40
   }
   codes.forEach(function(c){
     if(cards[c]) sum += Number(cards[c].range.value||0);
   });
   return sum/2; // finals: 8 items /2 = max 40
 }

 function forceTotal(){
   var total=calc().toFixed(1);
   document.querySelectorAll('*').forEach(function(el){
     if(el.children.length)return;
     var t=(el.textContent||'').trim();
     if(/\/\s*40/.test(t) && /(合計|FE)/.test(t)){
       el.textContent='合計 '+total+' / 40';
     }
   });
 }

 function apply(){
   var cards=findCards();
   codes.forEach(function(c){
     if(!cards[c])return;
     cards[c].card.style.setProperty(
       'display',
       (mode==='prelim' && !keep[c])?'none':'',
       'important'
     );
   });
   var b=document.getElementById('contestModeV17');
   b.textContent=mode==='final'?'決勝':'予選・準決勝';
   b.style.setProperty('background','#29292e','important');
   b.style.setProperty('border-color','#777','important');
   forceTotal();
 }

 function toggle(){
   mode=mode==='final'?'prelim':'final';
   apply();
   /* Reassert after legacy listeners finish their same-event updates. */
   setTimeout(forceTotal,0);
   setTimeout(forceTotal,50);
 }

 function start(){clearTimeout(timer);timer=setTimeout(toggle,1000);}
 function cancel(){clearTimeout(timer);timer=null;}

 function place(){
   var b=document.getElementById('contestModeV17');if(!b)return;
   if(matchMedia('(orientation: portrait)').matches){
     var csv=Array.from(document.querySelectorAll('button')).find(function(x){
       return /CSV保存/.test(x.textContent||'');
     });
     if(csv){
       var row=csv.parentElement;
       if(row&&row.parentElement)row.parentElement.insertBefore(b,row.nextSibling);
     }
   }else document.body.appendChild(b);
 }

 function init(){
   var b=document.getElementById('contestModeV17');if(!b)return;
   b.addEventListener('pointerdown',start);
   b.addEventListener('pointerup',cancel);
   b.addEventListener('pointercancel',cancel);
   b.addEventListener('pointerleave',cancel);
   b.addEventListener('click',function(e){e.preventDefault();});

   var cards=findCards();
   Object.keys(cards).forEach(function(c){
     ['input','change'].forEach(function(ev){
       cards[c].range.addEventListener(ev,function(){
         /* Run after older FE handlers, so this mode's formula is final. */
         setTimeout(forceTotal,0);
       });
     });
   });
   place();apply();
 }

 if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init,{once:true});
 else init();
 window.addEventListener('orientationchange',function(){
   setTimeout(function(){place();apply();},200);
 });
})();
</script>
