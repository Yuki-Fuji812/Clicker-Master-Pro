<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>YoYo Clicker</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:#0b0b0d;color:#fff;padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom)}
.wrap{max-width:760px;margin:auto}
h1{font-size:24px;margin:12px 0}
.urlrow{display:flex;gap:8px;margin-bottom:10px}
input{flex:1;padding:12px;border-radius:12px;border:1px solid #444;background:#18181b;color:#fff;font-size:16px}
button{border:0;border-radius:14px;font-weight:800;color:white;touch-action:manipulation}
.load{padding:0 16px;background:#3b82f6}
.video{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:14px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
.scorebox{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#18181b;border-radius:14px;padding:10px;text-align:center}
.stat b{display:block;font-size:26px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{height:82px;font-size:25px}
.plus{background:#16a34a}.minus{background:#dc2626}.miss{background:#ea580c}.special{background:#7c3aed}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.actions button{height:48px;background:#27272a;font-size:16px}
h2{font-size:18px;margin:18px 0 8px}
#history{background:#18181b;border-radius:14px;min-height:80px;max-height:230px;overflow:auto;padding:8px}
.item{display:flex;justify-content:space-between;border-bottom:1px solid #333;padding:9px 5px;font-size:14px}
.sheet{position:fixed;inset:0;background:#0009;display:none;align-items:flex-end;z-index:10}
.panel{width:100%;background:#18181b;border-radius:22px 22px 0 0;padding:18px 14px calc(18px + env(safe-area-inset-bottom))}
.panel h3{text-align:center;margin-top:0}
.penalties{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.penalties button{height:60px;background:#7c3aed;font-size:20px}
.cancel{width:100%;height:48px;margin-top:10px;background:#3f3f46}
.small{color:#aaa;font-size:12px;margin:8px 2px}
.special-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}.special-row .big{font-size:18px;height:72px}
.controller-box{background:#18181b;border-radius:14px;padding:12px;margin-top:12px;text-align:center}
.controller-map{font-size:13px;color:#aaa;margin-top:5px}
</style>
</head>
<body>
<div class="wrap">
<h1>YoYo Clicker</h1>
<div class="urlrow">
<input id="searchQ" placeholder="YouTubeで動画を検索">
<button class="load" onclick="searchVideo()">検索</button>
</div>

<div class="video" id="video"><div style="display:grid;place-items:center;height:100%;color:#888">YouTube動画を表示</div></div>
<div class="scorebox">
<div class="stat">合計<b id="totalScore">0</b></div>
<div class="stat">加点<b id="plusScore">0</b></div>
<div class="stat">減点<b id="minusScore">0</b></div>
</div>
<div class="grid">
<button class="big plus" onclick="addEvent('+1',1)">＋</button>
<button class="big minus" onclick="addEvent('-1',-1)">−</button>
</div>
<div class="special-row">
<button class="big special" onclick="specialNamed('停止',-1)">停止<br>-1</button>
<button class="big special" onclick="specialNamed('交換',-3)">交換<br>-3</button>
<button class="big special" onclick="specialNamed('切断',-5)">切断<br>-5</button>
</div>
<div class="actions">
<button onclick="undo()">UNDO</button>
<button onclick="resetAll()">リセット</button>
</div>
<p class="small">入力時刻は、この採点セッションを開始してからの経過時間として記録します。</p>
<div class="scorebox">
<div class="stat">停止 -1<b id="stopStat">0回</b></div>
<div class="stat">交換 -3<b id="changeStat">0回</b></div>
<div class="stat">切断 -5<b id="cutStat">0回</b></div>
</div>
<div class="controller-box">
<b id="controllerStatus">🎮 コントローラー未接続</b>
<div class="controller-map">L：＋　R：−　ZL：＋を1回取消　ZR：−を1回取消　X：停止　A：交換　B：切断</div>
</div>
<h2>採点履歴</h2>
<div id="history"></div>
</div>

<script>
let events = JSON.parse(localStorage.getItem("yoyo-events")||"[]");
let started = Number(localStorage.getItem("yoyo-started")) || Date.now();

function save(){localStorage.setItem("yoyo-events",JSON.stringify(events));localStorage.setItem("yoyo-started",started);render()}
function timeText(){
  let s=Math.floor((Date.now()-started)/1000), m=Math.floor(s/60);
  return String(m).padStart(2,"0")+":"+String(s%60).padStart(2,"0");
}
function addEvent(label,value){events.push({label,value,miss:false,time:timeText()});save();navigator.vibrate?.(20)}
function addMiss(){events.push({label:"MISS",value:0,miss:true,time:timeText()});save();navigator.vibrate?.(35)}
function specialNamed(name,v){events.push({label:name+" "+v,value:v,special:name,time:timeText()});save();navigator.vibrate?.(35)}
function undo(){events.pop();save()}
function resetAll(){if(confirm("採点をすべてリセットしますか？")){events=[];started=Date.now();save()}}
function openSpecial(){document.getElementById("sheet").style.display="flex"}
function closeSpecial(){document.getElementById("sheet").style.display="none"}
function render(){
 let plus=events.filter(e=>e.value>0).reduce((a,e)=>a+e.value,0);
 let minus=Math.abs(events.filter(e=>e.value<0).reduce((a,e)=>a+e.value,0));
 document.getElementById("totalScore").textContent=plus-minus;
 document.getElementById("plusScore").textContent=plus;
 document.getElementById("minusScore").textContent=minus;
 document.getElementById("stopStat").textContent=events.filter(e=>e.special==="停止").length+"回";
 document.getElementById("changeStat").textContent=events.filter(e=>e.special==="交換").length+"回";
 document.getElementById("cutStat").textContent=events.filter(e=>e.special==="切断").length+"回";
 document.getElementById("history").innerHTML=events.length?events.slice().reverse().map(e=>`<div class="item"><span>${e.time}</span><b>${e.label}</b></div>`).join(""):'<div style="padding:20px;text-align:center;color:#777">まだ入力はありません</div>';
}
function searchVideo(){
 let q=document.getElementById("searchQ").value.trim();
 if(!q){alert("検索する言葉を入力してください");return}
 window.open("https://www.youtube.com/results?search_query="+encodeURIComponent(q),"_blank");
}
function youtubeId(u){
 try{
  let x=new URL(u);
  if(x.hostname.includes("youtu.be")) return x.pathname.slice(1).split("/")[0];
  if(x.pathname.startsWith("/shorts/")) return x.pathname.split("/")[2];
  return x.searchParams.get("v");
 }catch(e){return null}
}
function loadVideo(){
 let id=youtubeId(document.getElementById("url").value.trim());
 if(!id){alert("YouTubeのURLを確認してください");return}
 document.getElementById("video").innerHTML=`<iframe src="https://www.youtube.com/embed/${id}?playsinline=1" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>`;
 localStorage.setItem("yoyo-url",document.getElementById("url").value.trim());
}



function undoBySign(sign){
  for(let i=events.length-1;i>=0;i--){
    const e=events[i];
    // Only cancel normal +/- scoring, not special penalties.
    if(!e.special && ((sign>0 && e.value>0) || (sign<0 && e.value<0))){
      events.splice(i,1);
      save();
      navigator.vibrate?.(25);
      return;
    }
  }
}

// Bluetooth / Gamepad controller
// Standard Gamepad mapping assumed:
// A=0, B=1, X=2, L/LB=4, R/RB=5.
// Edge detection prevents holding a button from repeatedly scoring.
let previousButtons = [];

window.addEventListener("gamepadconnected", e => {
  document.getElementById("controllerStatus").textContent =
    "🎮 接続済み: " + e.gamepad.id;
});
window.addEventListener("gamepaddisconnected", e => {
  document.getElementById("controllerStatus").textContent =
    "🎮 コントローラー未接続";
  previousButtons = [];
});

function pollGamepad(){
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  const gp = Array.from(pads).find(Boolean);
  if(gp){
    document.getElementById("controllerStatus").textContent =
      "🎮 接続済み: " + gp.id;
    const now = gp.buttons.map(b => b.pressed);
    const pressed = i => now[i] && !previousButtons[i];

    if(pressed(4)) addEvent("+1", 1);                 // L
    if(pressed(5)) addEvent("-1", -1);                // R
    if(pressed(6)) undoBySign(1);                     // ZL: last normal + undo
    if(pressed(7)) undoBySign(-1);                    // ZR: last normal - undo
    if(pressed(2)) specialNamed("停止", -1);          // X
    if(pressed(0)) specialNamed("交換", -3);          // A
    if(pressed(1)) specialNamed("切断", -5);          // B

    previousButtons = now;
  }
  requestAnimationFrame(pollGamepad);
}
requestAnimationFrame(pollGamepad);

render();
</script>
</body>
</html>
